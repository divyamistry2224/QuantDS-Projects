[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-direction-research"
version = "1.0.0"
description = "Reproducible SPY direction research with news sentiment, macro data and chronological model evaluation"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "numpy==2.3.5", "scikit-learn==1.8.0", "catboost==1.2.10", "openpyxl==3.1.5", "matplotlib==3.10.8", "requests==2.34.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
market-direction = "market_direction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
