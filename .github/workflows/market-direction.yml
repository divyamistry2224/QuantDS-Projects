name: Market direction research integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-direction-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market-direction-prediction/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m market_direction.cli verify
      - run: pytest -q
      - run: python scripts/sync_pages.py --check
